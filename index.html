<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herndon Sausage Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f0e6; --card:#fffaf2; --ink:#2a1d17; --muted:#7a6a5f; --line:#e6d9c6;
    --brand:#bf5700; --brand-ink:#fff; --accent:#d9822b; --done:#b7a99a; --tint:#f3e3cf;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1512; --card:#251d18; --ink:#f3e9dc; --muted:#b3a291; --line:#3a2e26;
      --brand:#c8641a; --accent:#e89a45; --done:#6f6257; --tint:#33271f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{background:var(--brand);color:var(--brand-ink);padding:22px 18px 18px}
  header h1{font-family:"Alfa Slab One",Georgia,serif;font-weight:400;font-size:28px;margin:0;letter-spacing:.5px}
  header p{margin:4px 0 0;opacity:.85;font-size:14px}
  header{position:relative}
  .fb-btn{position:absolute;top:16px;right:14px;background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.55);
    border-radius:999px;padding:7px 13px;font:600 13px Inter,sans-serif;cursor:pointer}
  .fb-btn:hover{background:rgba(255,255,255,.28)}
  header h1{padding-right:120px}
  .fb-back{position:fixed;inset:0;background:rgba(20,12,8,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
  .fb-back.open{display:flex}
  @media (min-width:560px){ .fb-back{align-items:center} }
  .fb{background:var(--card);color:var(--ink);width:100%;max-width:480px;border-radius:18px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .fb h2{margin:0 0 4px;font:700 20px Inter,sans-serif}
  .fb p.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
  .fb label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
  .fb input,.fb textarea{width:100%;font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);
    border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
  .fb input:focus,.fb textarea:focus{border-color:var(--accent)}
  .fb textarea{min-height:130px;resize:vertical}
  .fb .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .fb button{border-radius:10px;padding:11px 16px;font:600 15px Inter,sans-serif;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
  .fb button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .fb button:disabled{opacity:.6;cursor:default}
  .fb .msg{font-size:14px;margin-top:12px;min-height:1em}
  .fb .msg.err{color:#c0392b}
  .fb .hp{position:absolute;left:-9999px}
  main{max-width:640px;margin:0 auto;padding:16px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .pill{position:relative;display:inline-flex;align-items:center;max-width:100%;background:var(--card);color:var(--ink);
    border:1.5px solid var(--line);border-radius:999px;padding:9px 32px 9px 15px;font:600 14px Inter,sans-serif}
  .pill .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
  .pill::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;margin-top:-5px;
    border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);pointer-events:none}
  .pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .pill.on::after{border-color:#fff}
  .pill:focus-within{outline:2px solid var(--accent);outline-offset:2px}
  .rname{font:700 22px Inter,sans-serif;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .meat label{display:block;font-size:15px;font-weight:600;color:var(--muted)}
  .meat-row{display:flex;align-items:center;gap:10px;margin-top:8px}
  .meat input{flex:1;min-width:0;font:700 34px Inter,sans-serif;color:var(--ink);background:transparent;
    border:none;border-bottom:3px solid var(--accent);padding:2px 0;outline:none}
  .meat .unit{font:600 18px Inter,sans-serif;color:var(--muted)}
  .step{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);
    color:var(--ink);font:600 22px Inter,sans-serif;cursor:pointer}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .quick button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;
    padding:6px 10px;font:500 13px Inter,sans-serif;cursor:pointer}
  .note{font-size:13px;color:var(--muted);margin:10px 0 0}
  .tips{background:var(--tint);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px}
  .tips:empty{display:none}
  .tips p{margin:0 0 6px}.tips p:last-child{margin:0}
  ul.ing{list-style:none;margin:0;padding:0}
  .ing li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .ing li:last-child{border-bottom:none}
  .ing li.sec{cursor:default;padding:14px 2px 4px;border-bottom:none;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--accent);display:grid;place-items:center}
  .ing li.done .box{background:var(--accent)}
  .ing li.done .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .name{flex:1;min-width:0}
  .name b{display:block;font-weight:600}
  .name small{color:var(--muted);font-size:12px}
  .amt{text-align:right;white-space:nowrap}
  .amt b{font-size:20px;font-weight:700}
  .amt small{display:block;color:var(--muted);font-size:12px}
  .ing li.done .name b,.ing li.done .amt b{color:var(--done);text-decoration:line-through}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .linkbtn{background:none;border:none;color:var(--brand);font:600 14px Inter,sans-serif;cursor:pointer;padding:6px 0}
  .src{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 30px}
  .src a{color:inherit}
</style>
</head>
<body>
<header>
  <button class="fb-btn" id="fbOpen" type="button">Submit feedback</button>
  <h1>Herndon Sausage</h1>
  <p>Pick a recipe, enter your amount, and every ingredient scales.</p>
</header>
<main>
  <nav class="pills" id="pills" aria-label="Recipe categories"></nav>

  <section class="card meat">
    <h2 class="rname" id="rname"></h2>
    <label for="qty" id="qtyLabel">Total meat</label>
    <div class="meat-row">
      <button class="step" id="minus" aria-label="Less">−</button>
      <input id="qty" type="number" inputmode="decimal" min="0" step="0.5">
      <span class="unit" id="qtyUnit">lbs</span>
      <button class="step" id="plus" aria-label="More">+</button>
    </div>
    <div class="quick" id="quick"></div>
    <p class="note" id="desc"></p>
    <div class="tips" id="tips"></div>
  </section>

  <section class="card">
    <ul class="ing" id="list"></ul>
    <div class="foot">
      <small style="color:var(--muted)">Tap an ingredient to check it off.</small>
      <button class="linkbtn" id="reset">Clear checks</button>
    </div>
  </section>

  <p class="src" id="src"></p>
</main>

<div class="fb-back" id="fbBack" role="dialog" aria-modal="true" aria-labelledby="fbTitle">
  <form class="fb" id="fbForm" novalidate>
    <h2 id="fbTitle">Submit feedback</h2>
    <p class="sub">Questions, recipe tweaks, or something that looks off? Let me know.</p>
    <label for="fbEmail">Your email (so I can reply)</label>
    <input id="fbEmail" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <label for="fbText">Feedback</label>
    <textarea id="fbText" name="message" required placeholder="Type your feedback here"></textarea>
    <input class="hp" type="text" name="_honey" id="fbHoney" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="msg" id="fbMsg" aria-live="polite"></div>
    <div class="row">
      <button type="button" id="fbCancel">Cancel</button>
      <button type="submit" class="primary" id="fbSend">Send</button>
    </div>
  </form>
</div>

/* ---------- Formatting ---------- */
const TSP = {tsp:1, tbsp:3, cup:48};
const fmt = (n, d) => {
  let s = n.toFixed(d);
  if (s.includes(".")) s = s.replace(/0+$/,"").replace(/\.$/,"");
  return s;
};
const plural = (n, word) => n === 1 ? word.replace(/s$/,"") : word;

function volume(tsp){
  const tbsp = tsp/3, cups = tsp/48;
  if (tsp < 3)  return {main: fmt(tsp,2)+" tsp", alt: fmt(tbsp,2)+" tbsp"};
  if (tsp < 12) return {main: fmt(tbsp,1)+" tbsp", alt: fmt(tsp,1)+" tsp"};
  const main = fmt(cups,2)+" "+plural(+fmt(cups,2),"cups");
  if (cups >= 4) return {main, alt: fmt(cups/4,2)+" qt · "+fmt(cups/16,2)+" gal"};
  return {main, alt: fmt(tbsp,1)+" tbsp · "+fmt(tsp,1)+" tsp"};
}
function weight(oz){
  const g = oz*28.3495;
  if (oz >= 16){
    const lb = Math.floor(oz/16), rem = oz - lb*16;
    return {main: fmt(oz/16,2)+" lb", alt: rem >= 0.05 ? `${lb} lb ${fmt(rem,1)} oz` : fmt(g/1000,2)+" kg"};
  }
  return {main: fmt(oz, oz < 1 ? 2 : 1)+" oz", alt: fmt(g, g < 10 ? 1 : 0)+" g"};
}
function count(n, unit){
  return {main: fmt(n,2)+(unit==="whole" ? "" : " "+plural(+fmt(n,2),unit)), alt:""};
}
function amount(q, unit){
  if (unit in TSP) return volume(q*TSP[unit]);
  if (unit === "lb") return weight(q*16);
  if (unit === "oz") return weight(q);
  return count(q, unit);
}

/* ---------- State ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const byId = id => RECIPES.find(r => r.id === id);
let current = byId(location.hash.slice(1)) || byId(store.get("recipe")) || RECIPES[0];
let state = store.get("state2") || {};

const $ = id => document.getElementById(id);
const pills = $("pills"), list = $("list"), qty = $("qty");

function rs(){ return state[current.id] || (state[current.id] = {q: current.start, done: []}); }
function save(){ store.set("state2", state); store.set("recipe", current.id); }

/* ---------- Rendering ---------- */
const SHORT = {
  "Family recipes (per lb of meat)":"Family",
  "Pork & venison sausages (by weight)":"Pork & Venison",
  "Flavored sausages (by weight)":"Flavored",
  "Burgers (by weight)":"Burgers",
  "Jerky":"Jerky",
  "BBQ sauces, rubs & brines":"BBQ",
  "BBQ sides":"Sides"
};
const pillSelects = {};
function buildPicker(){
  const groups = {};
  RECIPES.forEach(r => (groups[r.group] = groups[r.group] || []).push(r));
  Object.entries(groups).forEach(([g, rs]) => {
    const wrap = document.createElement("span"); wrap.className = "pill";
    const sel = document.createElement("select"); sel.setAttribute("aria-label", g);
    const ph = new Option(SHORT[g] || g, ""); ph.disabled = true; sel.appendChild(ph);
    rs.forEach(r => sel.appendChild(new Option(r.name, r.id)));
    sel.onchange = () => { current = byId(sel.value); history.replaceState(null,"","#"+current.id); renderAll(); };
    const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = SHORT[g] || g;
    wrap.appendChild(lbl); wrap.appendChild(sel); pills.appendChild(wrap);
    pillSelects[g] = sel;
  });
}
function syncPills(){
  Object.entries(pillSelects).forEach(([g, sel]) => {
    const on = g === current.group;
    sel.value = on ? current.id : "";
    sel.parentNode.classList.toggle("on", on);
  });
}

function setQty(n){
  rs().q = Math.max(0, Math.round(n*100)/100);
  qty.value = rs().q; renderList(); save();
}

function baseLabel(){
  const m = current.mode, b = current.base;
  if (m === "mult") return "per batch";
  if (m === "season") return `per ${b} lbs seasoning`;
  if (m === "meat") return b === 1 ? "per lb" : `per ${b} lbs`;
  return `per ${b} lb batch`;
}

function renderList(animate){
  const s = rs(), factor = (parseFloat(s.q)||0) / current.base;
  // Remember where each row was, so moved rows can glide to their new spot.
  const before = {};
  if (animate) list.querySelectorAll("li[data-i]").forEach(li => before[li.dataset.i] = li.getBoundingClientRect().top);

  // Keep section headers in place; within each section, unchecked items first, checked at the bottom.
  const blocks = [[]];
  current.items.forEach((it, i) => {
    if (typeof it === "string") blocks.push([i]); else blocks[blocks.length-1].push(i);
  });
  const order = [];
  blocks.forEach(b => {
    const head = typeof current.items[b[0]] === "string" ? [b.shift()] : [];
    order.push(...head, ...b.filter(i => !s.done.includes(i)), ...b.filter(i => s.done.includes(i)));
  });

  list.innerHTML = "";
  order.forEach(i => {
    const it = current.items[i];
    const li = document.createElement("li");
    if (typeof it === "string"){ li.className = "sec"; li.textContent = it; list.appendChild(li); return; }
    const [name, amt, unit, note] = it;
    const out = amount(amt*factor, unit), base = amount(amt, unit);
    li.dataset.i = i;
    if (s.done.includes(i)) li.className = "done";
    li.innerHTML = `<span class="box"></span><span class="name"><b></b><small></small></span>
      <span class="amt"><b></b><small></small></span>`;
    li.querySelector(".name b").textContent = name;
    li.querySelector(".name small").textContent = `${base.main} ${baseLabel()}` + (note ? " · "+note : "");
    li.querySelector(".amt b").textContent = out.main;
    li.querySelector(".amt small").textContent = out.alt;
    li.onclick = () => {
      const k = s.done.indexOf(i);
      k >= 0 ? s.done.splice(k,1) : s.done.push(i);
      save(); renderList(true);
    };
    list.appendChild(li);
  });

  if (animate && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    list.querySelectorAll("li[data-i]").forEach(li => {
      const old = before[li.dataset.i];
      if (old === undefined) return;
      const dy = old - li.getBoundingClientRect().top;
      if (!dy) return;
      li.animate([{transform:`translateY(${dy}px)`},{transform:"translateY(0)"}],
        {duration:300, easing:"cubic-bezier(.2,.8,.2,1)"});
    });
  }
}

function renderAll(){
  const m = MODES[current.mode];
  syncPills();
  $("rname").textContent = current.name;
  $("qtyLabel").textContent = m.label;
  $("qtyUnit").textContent = m.unit;
  qty.step = m.step;
  const q = $("quick"); q.innerHTML = "";
  m.quick.forEach(n => {
    const b = document.createElement("button");
    b.textContent = current.mode === "mult" ? (n === 0.5 ? "½×" : n+"×") : n+" lb";
    b.onclick = () => setQty(n);
    q.appendChild(b);
  });
  let desc = current.desc || "";
  if (current.mode === "batch") desc = (desc ? desc+" " : "") + "Enter the total batch weight in lbs; the meat amounts are listed too.";
  $("desc").textContent = desc;
  $("tips").innerHTML = "";
  (current.tips || []).forEach(t => { const p = document.createElement("p"); p.textContent = t; $("tips").appendChild(p); });
  const [title, url] = SHEETS[current.src];
  $("src").innerHTML = `From your <a href="${url}"></a> sheet.`;
  $("src").querySelector("a").textContent = title;
  qty.value = rs().q;
  renderList(); save();
}

qty.addEventListener("input", () => { rs().q = qty.value; renderList(); save(); });
$("minus").onclick = () => setQty((parseFloat(rs().q)||0) - MODES[current.mode].step);
$("plus").onclick  = () => setQty((parseFloat(rs().q)||0) + MODES[current.mode].step);
$("reset").onclick = () => { rs().done = []; renderList(); save(); };
window.addEventListener("hashchange", () => { const r = byId(location.hash.slice(1)); if (r){ current = r; renderAll(); } });

buildPicker();
renderAll();

/* ---------- Feedback ---------- */
const FEEDBACK_ENDPOINT = "https://formsubmit.co/ajax/aba3276b6f82c58915db3dcc4756f136";
(() => {
  const back = $("fbBack"), form = $("fbForm"), msg = $("fbMsg"), send = $("fbSend");
  const email = $("fbEmail"), text = $("fbText");
  const open = () => { back.classList.add("open"); msg.textContent = ""; msg.className = "msg"; send.disabled = false; send.textContent = "Send"; setTimeout(() => email.focus(), 50); };
  const close = () => back.classList.remove("open");
  $("fbOpen").onclick = open;
  $("fbCancel").onclick = close;
  back.addEventListener("click", e => { if (e.target === back) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && back.classList.contains("open")) close(); });
  const err = t => { msg.textContent = t; msg.className = "msg err"; };
  // Backup: a normal form post (no background request), which FormSubmit always accepts.
  function classicSubmit(){
    const f = document.createElement("form");
    f.method = "POST"; f.action = FEEDBACK_ENDPOINT.replace("/ajax/", "/");
    const add = (n, v) => { const i = document.createElement("input"); i.type = "hidden"; i.name = n; i.value = v; f.appendChild(i); };
    add("email", email.value.trim()); add("message", text.value.trim()); add("recipe", current.name);
    add("_subject", "Sausage calculator feedback"); add("_replyto", email.value.trim());
    add("_template", "table"); add("_captcha", "false");
    add("_next", location.href.split("#")[0] + "#" + current.id);
    document.body.appendChild(f); f.submit();
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) { err("Please enter a valid email so I can reply."); email.focus(); return; }
    if (!text.value.trim()) { err("Please type your feedback."); text.focus(); return; }
    if ($("fbHoney").value) { close(); return; }
    send.disabled = true; send.textContent = "Sending…"; msg.textContent = ""; msg.className = "msg";
    try {
      const res = await fetch(FEEDBACK_ENDPOINT, {
        method: "POST",
        headers: {"Content-Type": "application/json", "Accept": "application/json"},
        body: JSON.stringify({
          email: email.value.trim(),
          message: text.value.trim(),
          recipe: current.name,
          _subject: "Sausage calculator feedback",
          _replyto: email.value.trim(),
          _template: "table",
          _captcha: "false"
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false || data.success === "false") {
        const m = String(data.message || "");
        if (/activat/i.test(m)) {
          msg.textContent = "Almost there: the site owner needs to activate this form (check email). Try again after that.";
          msg.className = "msg"; send.disabled = false; send.textContent = "Send"; return;
        }
        throw Object.assign(new Error(m || ("HTTP " + res.status)), {server: true});
      }
      msg.textContent = "Thanks! Your feedback was sent."; msg.className = "msg";
      send.textContent = "Sent"; text.value = "";
      setTimeout(close, 1800);
    } catch (ex) {
      send.disabled = false; send.textContent = "Send";
      if (ex.server) err("Sorry, it didn't send: " + ex.message);
      else if (!/github\.io$/.test(location.hostname)) err("Feedback can't send from this preview. Open the public site at bherndon.github.io/sausage to send it.");
      else classicSubmit();
    }
  });
})();
